name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build React app
        working-directory: frontend
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_ENV: production
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets to S3 (long-term cache)
        run: |
          aws s3 sync frontend/dist/static s3://${{ secrets.S3_BUCKET }}/static \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync HTML and other files to S3 (no cache)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} \
            --exclude "static/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      - name: Create CloudFront invalidation
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/*.html" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=${INVALIDATION_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id ${{ steps.invalidation.outputs.invalidation_id }}

      - name: Verify deployment
        run: |
          CLOUDFRONT_DOMAIN="${{ secrets.CLOUDFRONT_DOMAIN }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${CLOUDFRONT_DOMAIN}")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Deployment verified — HTTP ${HTTP_STATUS}"
          else
            echo "❌ Deployment verification failed — HTTP ${HTTP_STATUS}"
            exit 1
          fi

      - name: Post deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          INVALIDATION_ID: ${{ steps.invalidation.outputs.invalidation_id }}
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${DEPLOY_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${DEPLOY_BRANCH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${DEPLOY_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Invalidation ID** | \`${INVALIDATION_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
